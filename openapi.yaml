openapi: 3.0.3
info:
  title: Automation Star E-commerce Checkout API
  version: 1.0.0
  description: In-memory demo checkout API. Cash receives a 10 percent discount; credit card receives none. Credit-card payments are simulated.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: alice@example.com }
        password: { type: string, example: 'Password123!' }
    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, example: 1 }
        quantity: { type: integer, minimum: 1, example: 2 }
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Dana }
                email: { type: string, format: email, example: dana@example.com }
                password: { type: string, minLength: 8, example: 'Password123!' }
      responses:
        '201': { description: User created }
        '400': { description: Invalid input }
        '409': { description: Email already registered }
  /login:
    post:
      summary: Log in and obtain a Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tokenType: { type: string, example: Bearer }
                  user: { type: object }
        '400': { description: Invalid input }
        '401': { description: Invalid credentials }
  /cart:
    post:
      summary: Replace the authenticated user's cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/CartItem'
      responses:
        '200': { description: Cart updated with line totals and subtotal }
        '400': { description: Invalid cart }
        '401': { description: Unauthorized }
        '404': { description: Unknown product }
        '409': { description: Insufficient stock }
  /checkout:
    post:
      summary: Checkout with cash discount or full-price credit card
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod:
                  type: string
                  enum: [cash, credit_card]
                  example: cash
      responses:
        '201':
          description: Order created, stock decremented, and cart cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id: { type: integer }
                      userId: { type: integer }
                      items: { type: array, items: { type: object } }
                      paymentMethod: { type: string }
                      subtotal: { type: number, example: 125 }
                      discount: { type: number, example: 12.5 }
                      total: { type: number, example: 112.5 }
        '400': { description: Invalid payment method or empty cart }
        '401': { description: Unauthorized }
        '409': { description: Insufficient stock }
